<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin - Poznámky</title>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    
    <!-- SortableJS pre plynulé ťahanie -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

    <style>
        :root {
            --bg-color: #000000;
            --panel-bg: #1c1c1e; /* Apple tmavá šedá */
            --panel-border: rgba(255, 255, 255, 0.08);
            --text-main: #f5f5f7;
            --text-muted: #86868b;
            --accent-color: #0a84ff;
            --danger-color: #ff453a;
            --radius: 20px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .admin-panel {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: var(--radius);
            padding: 24px;
            width: 100%;
            max-width: 600px;
            margin-top: 5vh;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        h2 { 
            margin-bottom: 24px; 
            font-size: 1.4rem; 
            font-weight: 700;
        }

        .add-note-container {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
            width: 100%;
        }

        input[type="text"] {
            flex: 1;
            min-width: 0;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid var(--panel-border);
            background: rgba(255, 255, 255, 0.04);
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        .btn-add {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 0 24px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            flex-shrink: 0;
        }

        .btn-add:active { opacity: 0.7; }

        .note-item {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.04);
            padding: 12px 16px;
            border-radius: 16px;
            margin-bottom: 10px;
            gap: 12px;
            transition: background 0.2s;
        }

        .note-item.sortable-ghost {
            opacity: 0.3;
            background: rgba(10, 132, 255, 0.3);
        }

        .drag-handle {
            cursor: grab;
            color: var(--text-muted);
            font-size: 1.2rem;
            user-select: none;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .drag-handle:active {
            cursor: grabbing;
        }

        .note-text {
            flex: 1;
            font-size: 1rem;
            min-width: 0;
            word-wrap: break-word;
            line-height: 1.4;
        }

        .controls {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .btn-icon {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-icon:active {
            background: rgba(255, 255, 255, 0.2);
        }

        .btn-danger { 
            background: rgba(255, 69, 58, 0.15); 
            color: var(--danger-color); 
        }

        .btn-danger:active {
            background: var(--danger-color);
            color: white;
        }

        /* ZALOMENIE NA MOBILE */
        @media (max-width: 500px) {
            .admin-panel {
                padding: 20px;
                margin-top: 0;
                border: none;
                border-radius: 0;
                background: transparent;
                box-shadow: none;
            }
            body {
                padding: 0;
            }
            .add-note-container {
                flex-direction: column;
                gap: 10px;
            }
            .btn-add {
                width: 100%;
                padding: 14px 0;
            }
        }
    </style>
</head>
<body>

    <div class="admin-panel">
        <h2>Správa poznámok</h2>
        
        <div class="add-note-container">
            <input type="text" id="new-note" placeholder="Napíš novú poznámku..." onkeypress="if(event.key === 'Enter') addNote()">
            <button class="btn-add" onclick="addNote()">Pridať</button>
        </div>

        <div id="notes-list"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBZmGJ715pJkMZJut9aSNfsm04oQH1YeCw",
            authDomain: "dauko-dashboard.firebaseapp.com",
            databaseURL: "https://dauko-dashboard-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "dauko-dashboard",
            storageBucket: "dauko-dashboard.firebasestorage.app",
            messagingSenderId: "112349370791",
            appId: "1:112349370791:web:d9ab50d25ecd89bc55be82"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        let sortableInstance = null;

        db.ref('notes').on('value', (snapshot) => {
            const container = document.getElementById('notes-list');
            container.innerHTML = '';
            
            let notesArray = [];

            snapshot.forEach((child) => {
                const val = child.val();
                notesArray.push({
                    id: child.key,
                    text: val.text || '',
                    order: val.order !== undefined ? val.order : 999 
                });
            });

            notesArray.sort((a, b) => a.order - b.order);

            notesArray.forEach((note) => {
                const div = document.createElement('div');
                div.className = 'note-item';
                div.dataset.id = note.id;

                // Tu sú už iba ikony (✏️ a ✖) bez textu, aby to nepretieklo na mobile
                div.innerHTML = `
                    <div class="drag-handle">☰</div>
                    <div class="note-text">${note.text}</div>
                    <div class="controls">
                        <button class="btn-icon" onclick="editNote('${note.id}', '${note.text.replace(/'/g, "\\'")}')">✎</button>
                        <button class="btn-icon btn-danger" onclick="deleteNote('${note.id}')">✖</button>
                    </div>
                `;
                container.appendChild(div);
            });

            initSortable();
        });

        function initSortable() {
            const container = document.getElementById('notes-list');
            if (sortableInstance) sortableInstance.destroy();

            sortableInstance = new Sortable(container, {
                handle: '.drag-handle',
                animation: 250,
                ghostClass: 'sortable-ghost',
                onEnd: function () {
                    const items = Array.from(container.children);
                    const updates = {};
                    
                    items.forEach((item, index) => {
                        const id = item.dataset.id;
                        updates[`notes/${id}/order`] = index;
                    });
                    
                    db.ref().update(updates);
                }
            });
        }

        function addNote() {
            const input = document.getElementById('new-note');
            const text = input.value.trim();
            if (!text) return;

            db.ref('notes').once('value').then(snapshot => {
                const count = snapshot.numChildren();
                db.ref('notes').push({ text: text, order: count });
                input.value = '';
            }).catch(error => {
                console.error("Chyba pri pridávaní:", error);
            });
        }

        function editNote(id, currentText) {
            const newText = prompt("Uprav poznámku:", currentText);
            if (newText && newText.trim() !== "") {
                db.ref(`notes/${id}`).update({ text: newText.trim() });
            }
        }

        function deleteNote(id) {
            if (confirm("Naozaj chceš zmazať túto poznámku?")) {
                db.ref(`notes/${id}`).remove();
            }
        }
    </script>
</body>
</html>
