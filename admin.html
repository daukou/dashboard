<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dauko Dashboard</title>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-color: #000000;
            --panel-bg: rgba(28, 28, 30, 0.65);
            --panel-border: rgba(255, 255, 255, 0.08);
            --text-main: #f5f5f7;
            --text-muted: #86868b;
            --accent-color: #0a84ff;
            --danger-color: #ff453a;
            --radius: 28px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 15% 50%, rgba(25, 25, 32, 1), #000000 60%);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            padding: 20px;
            gap: 20px;
            overflow: hidden;
        }

        /* 3/4 Šírky pre hlavný obsah */
        .main-content {
            flex: 3;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 1/4 Šírky pre rozvrh */
        .sidebar {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* HORNA 1/2 HLAVNEHO OBSAHU */
        .top-widgets {
            display: flex;
            gap: 20px;
            flex: 1; 
        }

        /* SPODNA 1/2 HLAVNEHO OBSAHU */
        .panel-notes {
            flex: 1; 
            display: flex;
            flex-direction: column;
        }

        .panel {
            background: var(--panel-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--panel-border);
            border-radius: var(--radius);
            padding: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* Špecifické vlastnosti widgetov */
        .panel-time { flex: 1.2; justify-content: center; align-items: center; }
        .panel-date { flex: 1; justify-content: center; align-items: center; }
        .panel-nas { flex: 1; justify-content: space-between; align-items: center; }

        .panel-schedule {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .panel-label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
            width: 100%;
            text-align: left;
            margin-bottom: 16px;
        }

        /* --- ČAS A BLIKAJÚCA DVOJBODKA --- */
        #clock-container {
            font-size: 7.5rem;
            font-weight: 700;
            letter-spacing: -3px;
            line-height: 1;
            display: flex;
            align-items: center;
        }

        @keyframes blink-colon {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        .blink {
            animation: blink-colon 2s infinite;
            margin: 0 -5px;
        }

        /* --- APPLE KALENDÁR WIDGET --- */
        .calendar-icon {
            width: 160px;
            height: 160px;
            background-color: #1c1c1e;
            border-radius: 28px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .cal-top {
            background-color: #ff3b30;
            color: white;
            text-align: center;
            font-weight: 700;
            font-size: 1.1rem;
            padding: 8px 0;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .cal-middle {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5.5rem;
            font-weight: 700;
            color: white;
            letter-spacing: -3px;
            line-height: 1;
            margin-top: 5px;
        }

        .cal-bottom {
            text-align: center;
            padding-bottom: 12px;
            font-size: 1.1rem;
            font-weight: 500;
            color: #98989d;
        }

        /* --- POZNÁMKY --- */
        .notes-list {
            list-style: none;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            flex: 1;
            padding-right: 10px;
        }

        .notes-list::-webkit-scrollbar, .schedule-list::-webkit-scrollbar {
            display: none;
        }

        .note-item {
            font-size: 1.2rem;
            font-weight: 400;
            background: rgba(255, 255, 255, 0.04);
            padding: 18px 20px;
            border-radius: 20px;
            line-height: 1.4;
            display: flex;
            align-items: center;
        }
