<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Poznámky</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0f111a;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            padding: 20px;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #8a92b2;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        input {
            flex: 1;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background-color: #1c2033;
            color: #ffffff;
            font-size: 1rem;
            outline: none;
        }

        button {
            padding: 15px 20px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
            color: white;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
        }

        .note-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #1c2033;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            border-left: 4px solid #00d2ff;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #ff4757;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 5px 10px;
        }
    </style>
</head>
<body>

    <h1>Poznámky na stenu</h1>

    <div class="input-group">
        <input type="text" id="note-input" placeholder="Nová poznámka...">
        <button onclick="addNote()">Pridať</button>
    </div>

    <div id="notes-list"></div>

    <script>
        // === SEM VLOŽ ROVNAKÝ KONFIGURAČNÝ OBJEKT Z FIREBASE ===
        const firebaseConfig = {
            apiKey: "AIzaSyBZmGJ715pJkMZJut9aSNfsm04oQH1YeCw",
            authDomain: "dauko-dashboard.firebaseapp.com",
            databaseURL: "https://dauko-dashboard-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "dauko-dashboard",
            storageBucket: "dauko-dashboard.firebasestorage.app",
            messagingSenderId: "112349370791",
            appId: "1:112349370791:web:d9ab50d25ecd89bc55be82",
            measurementId: "G-MZRFBJ25SZ"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function addNote() {
            const input = document.getElementById('note-input');
            const text = input.value.trim();
            if (text !== '') {
                db.ref('notes').push({ text: text });
                input.value = '';
            }
        }

        function deleteNote(id) {
            db.ref('notes/' + id).remove();
        }

        db.ref('notes').on('value', (snapshot) => {
            const list = document.getElementById('notes-list');
            list.innerHTML = '';
            const data = snapshot.val();
            if (data) {
                Object.keys(data).forEach(key => {
                    const item = document.createElement('div');
                    item.className = 'note-item';
                    item.innerHTML = `
                        <span>${data[key].text}</span>
                        <button class="delete-btn" onclick="deleteNote('${key}')">✕</button>
                    `;
                    list.appendChild(item);
                });
            }
        });
    </script>
</body>
</html>
