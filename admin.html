<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Poznámky</title>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    
    <!-- SortableJS pre plynulé ťahanie -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

    <style>
        :root {
            --bg-color: #000000;
            --panel-bg: rgba(28, 28, 30, 0.65);
            --panel-border: rgba(255, 255, 255, 0.08);
            --text-main: #f5f5f7;
            --text-muted: #86868b;
            --accent-color: #0a84ff;
            --danger-color: #ff453a;
            --radius: 20px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .admin-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--panel-border);
            border-radius: var(--radius);
            padding: 30px;
            width: 100%;
            max-width: 700px;
            margin-top: 20px;
        }

        h2 { margin-bottom: 20px; font-size: 1.5rem; }

        .add-note-container {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            width: 100%;
        }

        input[type="text"] {
            flex: 1;
            min-width: 0; /* Zabraňuje pretekaniu na malých obrazovkách */
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid var(--panel-border);
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 1.1rem;
        }

        button {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            flex-shrink: 0;
        }

        button:active { opacity: 0.7; }

        .note-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.04);
            padding: 16px;
            border-radius: 16px;
            margin-bottom: 10px;
            transition: background 0.2s;
            gap: 12px;
        }

        .note-item.sortable-ghost {
            opacity: 0.4;
            background: rgba(10, 132, 255, 0.2);
        }

        .drag-handle {
            cursor: grab;
            padding: 0 5px;
            color: var(--text-muted);
            font-size: 1.5rem;
            user-select: none;
            flex-shrink: 0;
        }

        .drag-handle:active {
            cursor: grabbing;
        }

        .note-text {
            flex: 1;
            font-size: 1.1rem;
            min-width: 0;
            word-wrap: break-word;
        }

        .controls {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .btn-icon {
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 12px;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-danger { background: rgba(255, 69, 58, 0.2); color: var(--danger-color); }

        /* RESPONZÍVNY DIZAJN PRE MOBILY */
        @media (max-width: 550px) {
            .admin-panel {
                padding: 20px;
            }

            .add-note-container {
                flex-direction: column;
            }

            .add-note-container button {
                width: 100%;
                padding: 14px;
            }

            .note-item {
                flex-wrap: wrap;
                padding: 12px;
            }

            .note-text {
                /* Text zaberie zvyšok šírky vedľa ikony na ťahanie */
                flex-basis: calc(100% - 45px); 
            }

            .controls {
                width: 100%;
                justify-content: space-between;
                border-top: 1px solid rgba(255, 255, 255, 0.05);
                padding-top: 12px;
                margin-top: 4px;
            }

            .btn-icon {
                flex: 1;
            }
        }
    </style>
</head>
<body>

    <div class="admin-panel">
        <h2>Správa poznámok</h2>
        
        <div class="add-note-container">
            <input type="text" id="new-note" placeholder="Napíš novú poznámku..." onkeypress="if(event.key === 'Enter') addNote()">
            <button onclick="addNote()">Pridať</button>
        </div>

        <div id="notes-list"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBZmGJ715pJkMZJut9aSNfsm04oQH1YeCw",
            authDomain: "dauko-dashboard.firebaseapp.com",
            databaseURL: "https://dauko-dashboard-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "dauko-dashboard",
            storageBucket: "dauko-dashboard.firebasestorage.app",
            messagingSenderId: "112349370791",
            appId: "1:112349370791:web:d9ab50d25ecd89bc55be82"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        let sortableInstance = null;

        db.ref('notes').on('value', (snapshot) => {
            const container = document.getElementById('notes-list');
            container.innerHTML = '';
            
            let notesArray = [];

            snapshot.forEach((child) => {
                const val = child.val();
                notesArray.push({
                    id: child.key,
                    text: val.text || '',
                    order: val.order !== undefined ? val.order : 999 
                });
            });

            notesArray.sort((a, b) => a.order - b.order);

            notesArray.forEach((note) => {
                const div = document.createElement('div');
                div.className = 'note-item';
                div.dataset.id = note.id;

                div.innerHTML = `
                    <div class="drag-handle">☰</div>
                    <div class="note-text">${note.text}</div>
                    <div class="controls">
                        <button class="btn-icon" onclick="editNote('${note.id}', '${note.text.replace(/'/g, "\\'")}')">✎ Upraviť</button>
                        <button class="btn-icon btn-danger" onclick="deleteNote('${note.id}')">✖ Zmazať</button>
                    </div>
                `;
                container.appendChild(div);
            });

            initSortable();
        });

        function initSortable() {
            const container = document.getElementById('notes-list');
            if (sortableInstance) sortableInstance.destroy();

            sortableInstance = new Sortable(container, {
                handle: '.drag-handle',
                animation: 250,
                ghostClass: 'sortable-ghost',
                onEnd: function () {
                    const items = Array.from(container.children);
                    const updates = {};
                    
                    items.forEach((item, index) => {
                        const id = item.dataset.id;
                        updates[`notes/${id}/order`] = index;
                    });
                    
                    db.ref().update(updates);
                }
            });
        }

        function addNote() {
            const input = document.getElementById('new-note');
            const text = input.value.trim();
            if (!text) return;

            db.ref('notes').once('value').then(snapshot => {
                const count = snapshot.numChildren();
                db.ref('notes').push({ text: text, order: count });
                input.value = '';
            }).catch(error => {
                console.error("Chyba pri pridávaní:", error);
            });
        }

        function editNote(id, currentText) {
            const newText = prompt("Uprav poznámku:", currentText);
            if (newText && newText.trim() !== "") {
                db.ref(`notes/${id}`).update({ text: newText.trim() });
            }
        }

        function deleteNote(id) {
            if (confirm("Naozaj chceš zmazať túto poznámku?")) {
                db.ref(`notes/${id}`).remove();
            }
        }
    </script>
</body>
</html>
