<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dauko Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Tmavé farby v štýle moderného dashboardu */
            --bg-color: #0f111a;
            --panel-bg: #1c2033;
            --text-main: #ffffff;
            --text-muted: #8a92b2;
            --accent-gradient: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 12px; /* Minimálny okraj 12px od krajov celej obrazovky */
            gap: 12px;     /* Medzera medzi horným a dolným blokom */
            overflow: hidden;
        }

        /* HORNÝ RIADOK (Čas a Dátum) */
        .top-row {
            display: flex;
            height: 45%; /* Horné panely zaberajú 45% výšky obrazovky */
            gap: 12px;   /* Medzera medzi panelmi */
        }

        .panel {
            background-color: var(--panel-bg);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            flex: 1; /* Obe horné karty (čas aj dátum) budú rovnako široké */
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        /* Štýly pre texty v paneloch */
        #clock {
            font-size: 8rem;
            font-weight: 800;
            letter-spacing: 2px;
        }

        #day {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: 4px; /* Zmenšený rozostup */
            white-space: nowrap; /* Zabezpečí, že sa slovo nikdy nezalomí */
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        #date {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        /* SPODNÝ RIADOK (Rozvrh) */
        .bottom-row {
            flex: 1; /* Zaberie zvyšok výšky (55%) */
            background-color: var(--panel-bg);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        #schedule-label {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 2px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        #schedule {
            display: flex;
            flex: 1; /* Kontajner pre dlaždice sa roztiahne na zvyšok panela */
            gap: 12px;
        }

        /* Dlaždice predmetov */
        .tile {
            flex: 1; /* Všetky dlaždice sa rovnomerne roztiahnu na šírku */
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
