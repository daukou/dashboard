<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dauko Dashboard</title>
    
    <!-- Moderný font Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: relative;
            /* Zamedzenie označovania textu pri dotyku */
            user-select: none; 
            -webkit-user-select: none;
        }

        /* 
           Pozadie s logom – naplní celú obrazovku, 100% nepriehľadnosť
        */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('daukoProfilovka.png');
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover; /* Vyplní celú plochu obrazovky */
            opacity: 1.0; /* Plná viditeľnosť / nepriehľadné */
            z-index: -1;
        }

        /* Ľavý horný roh - Čas */
        .top-left {
            position: absolute;
            top: 50px;
            left: 60px;
            font-size: 6rem;
            font-weight: 700;
            line-height: 1;
            text-shadow: 0px 4px 20px rgba(0, 0, 0, 0.9); /* Tieň pre skvelú čitateľnosť */
        }

        /* Pravý horný roh - Dátum vycentrovaný pod dňom */
        .top-right {
            position: absolute;
            top: 50px;
            right: 60px;
            display: flex;
            flex-direction: column;
            align-items: center; /* Vycentrovanie dňa a dátumu na stred */
            text-align: center;
            text-shadow: 0px 4px 20px rgba(0, 0, 0, 0.9);
        }

        #day {
            font-size: 2.8rem;
            font-weight: 700;
            letter-spacing: 12px;
            /* Kompenzácia poslednej medzery v letter-spacing pre perfektné vycentrovanie */
            margin-right: -12px; 
            margin-bottom: 6px;
        }

        #date {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 3px;
            margin-right: -3px;
        }
    </style>
</head>
<body>

    <!-- Čas vľavo hore -->
    <div class="top-left">
        <div id="clock">00:00</div>
    </div>

    <!-- Dátum vpravo hore (Vycentrovaný) -->
    <div class="top-right">
        <div id="day">DEŇ</div>
        <div id="date">00 MESIAC 0000</div>
    </div>

    <script>
        function updateDashboard() {
            const now = new Date();
            
            // Hodiny a minúty (HH:MM)
            let hours = String(now.getHours()).padStart(2, '0');
            let minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${minutes}`;
            
            // Slovenské dni a mesiace
            const days = ['NEDEĽA', 'PONDELOK', 'UTOROK', 'STREDA', 'ŠTVRTOK', 'PIATOK', 'SOBOTA'];
            const months = ['JANUÁR', 'FEBRUÁR', 'MAREC', 'APRÍL', 'MÁJ', 'JÚN', 'JÚL', 'AUGUST', 'SEPTEMBER', 'OKTÓBER', 'NOVEMBER', 'DECEMBER'];
            
            // Nastavenie dňa v týždni
            document.getElementById('day').textContent = days[now.getDay()];
            
            // Nastavenie dátumu (DD MESIAC RRRR)
            let dayNum = String(now.getDate()).padStart(2, '0');
            let month = months[now.getMonth()];
            let year = now.getFullYear();
            
            document.getElementById('date').textContent = `${dayNum} ${month} ${year}`;
        }

        // Spustenie pri načítaní a aktualizácia každú sekundu
        updateDashboard();
        setInterval(updateDashboard, 1000);
    </script>
</body>
</html>
