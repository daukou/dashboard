<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daukou Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Firebase SDK (pre prepojenie s databázou) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-color: #0f111a;
            --panel-bg: #1c2033;
            --text-main: #ffffff;
            --text-muted: #8a92b2;
            --accent-gradient: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 12px;
            gap: 12px;
            overflow: hidden;
        }

        .top-row {
            display: flex;
            height: 45%;
            gap: 12px;
        }

        .panel {
            background-color: var(--panel-bg);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .panel-time { flex: 1; }
        .panel-date { flex: 1; }
        .panel-notes { 
            flex: 1.5;
            align-items: flex-start;
            padding: 25px;
            justify-content: flex-start;
            overflow: hidden;
        }

        #clock {
            font-size: 7rem;
            font-weight: 800;
            letter-spacing: 2px;
        }

        #day {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: 4px;
            white-space: nowrap;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        #date {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .notes-label {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 2px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .notes-list {
            list-style: none;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
            max-height: 80%;
        }

        .note-item {
            display: flex;
            align-items: center;
            font-size: 1.1rem;
            font-weight: 600;
            background-color: rgba(255, 255, 255, 0.03);
            padding: 12px 15px;
            border-radius: 8px;
            border-left: 4px solid #00d2ff;
            word-break: break-word;
        }

        .bottom-row {
            flex: 1;
            background-color: var(--panel-bg);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        #schedule-label {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 2px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        #schedule {
            display: flex;
            flex: 1;
            gap: 12px;
        }

        .tile {
            flex: 1;
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }

        .tile-period {
            font-size: 0.75rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 4px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .tile-subject {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .tile-time {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .tile.active {
            background: var(--accent-gradient);
            border: none;
            color: #ffffff;
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.4);
            transform: scale(1.02);
        }

        .tile.active .tile-period { color: rgba(255, 255, 255, 0.8); }
        .tile.active .tile-time { color: rgba(255, 255, 255, 0.9); }
    </style>
</head>
<body>

    <div class="top-row">
        <div class="panel panel-time">
            <div id="clock">00:00</div>
        </div>
        <div class="panel panel-date">
            <div id="day">DEŇ</div>
            <div id="date">00. MESIAC 0000</div>
        </div>
        <div class="panel panel-notes">
            <div class="notes-label">Moje poznámky</div>
            <ul class="notes-list" id="notes-container">
                <li class="note-item" style="opacity: 0.5;">Načítavam...</li>
            </ul>
        </div>
    </div>

    <div class="bottom-row">
        <div id="schedule-label">DNEŠNÝ ROZVRH</div>
        <div id="schedule"></div>
    </div>

    <script>
        // === SEM VLOŽ SVOJ KONFIGURAČNÝ OBJEKT Z FIREBASE ===
          const firebaseConfig = {
    apiKey: "AIzaSyBZmGJ715pJkMZJut9aSNfsm04oQH1YeCw",
    authDomain: "dauko-dashboard.firebaseapp.com",
    databaseURL: "https://dauko-dashboard-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "dauko-dashboard",
    storageBucket: "dauko-dashboard.firebasestorage.app",
    messagingSenderId: "112349370791",
    appId: "1:112349370791:web:d9ab50d25ecd89bc55be82",
    measurementId: "G-MZRFBJ25SZ"
  };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Realtime Počúvanie na zmeny v databáze
        db.ref('notes').on('value', (snapshot) => {
            const container = document.getElementById('notes-container');
            container.innerHTML = '';
            const data = snapshot.val();
            
            if (data) {
                Object.keys(data).forEach(key => {
                    const li = document.createElement('li');
                    li.className = 'note-item';
                    li.textContent = data[key].text;
                    container.appendChild(li);
                });
            } else {
                container.innerHTML = '<li class="note-item" style="opacity: 0.4;">Žiadne poznámky</li>';
            }
        });

        const scheduleData = {
            1: [ 
                { p: 1, s: 'SJL', start: '08:00', end: '08:45' },
                { p: 2, s: 'MAT', start: '08:50', end: '09:35' },
                { p: 3, s: 'INP', start: '09:45', end: '10:30' },
                { p: 4, s: 'ANJ', start: '10:50', end: '11:35' },
                { p: 5, s: 'LIN', start: '11:40', end: '12:25' },
                { p: 6, s: 'PBE', start: '12:35', end: '13:20' },
                { p: 7, s: 'PBE', start: '13:30', end: '14:15' }
            ],
            2: [ 
                { p: 1, s: 'OBP', start: '08:00', end: '08:45' },
                { p: 2, s: 'OBP', start: '08:50', end: '09:35' },
                { p: 3, s: 'ANJ', start: '09:45', end: '10:30' },
                { p: 4, s: 'SJL', start: '10:50', end: '11:35' },
                { p: 5, s: 'MAT', start: '11:40', end: '12:25' },
                { p: 6, s: 'NEJ', start: '12:35', end: '13:20' }
            ],
            3: [ 
                { p: 0, s: 'TSV', start: '07:10', end: '07:55' },
                { p: 1, s: 'TSV', start: '08:00', end: '08:45' },
                { p: 2, s: 'INP', start: '08:50', end: '09:35' },
                { p: 3, s: 'TEM', start: '09:45', end: '10:30' },
                { p: 4, s: 'TEM', start: '10:50', end: '11:35' },
                { p: 5, s: 'OBP', start: '11:40', end: '12:25' },
                { p: 6, s: 'OBP', start: '12:35', end: '13:20' },
                { p: 7, s: 'TH',  start: '13:30', end: '14:15' }
            ],
            4: [ 
                { p: 1, s: 'DDW', start: '08:00', end: '08:45' },
                { p: 2, s: 'DDW', start: '08:50', end: '09:35' },
                { p: 3, s: 'DDW', start: '09:45', end: '10:30' },
                { p: 4, s: 'SJL', start: '10:50', end: '11:35' },
                { p: 5, s: 'OBN', start: '11:40', end: '12:25' },
                { p: 6, s: 'ANJ', start: '12:35', end: '13:20' },
                { p: 7, s: 'ANJ', start: '13:30', end: '14:15' }
            ],
            5: [ 
                { p: 1, s: 'ODP', start: '08:00', end: '08:45' },
                { p: 2, s: 'ODP', start: '08:50', end: '09:35' },
                { p: 3, s: 'NEJ', start: '09:45', end: '10:30' },
                { p: 4, s: 'NEJ', start: '10:50', end: '11:35' },
                { p: 5, s: 'LIN', start: '11:40', end: '12:25' },
                { p: 6, s: 'LIN', start: '12:35', end: '13:20' }
            ]
        };

        function timeToMinutes(timeStr) {
            const [h, m] = timeStr.split(':').map(Number);
            return h * 60 + m;
        }

        let lastRenderedMinute = -1;

        function updateDashboard() {
            const now = new Date();
            const currentHours = now.getHours();
            const currentMinutes = now.getMinutes();
            const currentTotalMinutes = currentHours * 60 + currentMinutes;
            const currentDay = now.getDay();
            
            let hStr = currentHours.toString().padStart(2, '0');
            let mStr = currentMinutes.toString().padStart(2, '0');
            document.getElementById('clock').textContent = `${hStr}:${mStr}`;
            
            if (currentTotalMinutes === lastRenderedMinute) return;
            lastRenderedMinute = currentTotalMinutes;

            const daysArr = ['Nedeľa', 'Pondelok', 'Utorok', 'Streda', 'Štvrtok', 'Piatok', 'Sobota'];
            const monthsArr = ['január', 'február', 'marec', 'apríl', 'máj', 'jún', 'júl', 'august', 'september', 'október', 'november', 'december'];
            
            let dayText = daysArr[currentDay].split('').join(' ');
            document.getElementById('day').textContent = dayText;
            document.getElementById('date').textContent = `${now.getDate()}. ${monthsArr[now.getMonth()]} ${now.getFullYear()}`;

            let displayDay = currentDay;
            let label = "Dnešný rozvrh";
            let todaysSchedule = scheduleData[currentDay];
            let isDayOver = false;

            if (todaysSchedule) {
                const lastClass = todaysSchedule[todaysSchedule.length - 1];
                if (currentTotalMinutes > timeToMinutes(lastClass.end)) {
                    isDayOver = true;
                }
            } else {
                isDayOver = true;
            }

            if (isDayOver) {
                label = "Zajtrajší rozvrh";
                displayDay = currentDay + 1;
                
                if (currentDay === 5 || currentDay === 6 || currentDay === 0) {
                    displayDay = 1;
                    label = "Pondelkový rozvrh";
                }
            }

            const scheduleContainer = document.getElementById('schedule');
            document.getElementById('schedule-label').textContent = label;
            scheduleContainer.innerHTML = ''; 

            const classesToDisplay = scheduleData[displayDay];

            if (classesToDisplay) {
                classesToDisplay.forEach(item => {
                    const tile = document.createElement('div');
                    tile.className = 'tile';

                    if (!isDayOver && displayDay === currentDay) {
                        if (currentTotalMinutes >= timeToMinutes(item.start) && currentTotalMinutes <= timeToMinutes(item.end)) {
                            tile.classList.add('active'); 
                        }
                    }

                    const periodDiv = document.createElement('div');
                    periodDiv.className = 'tile-period';
                    periodDiv.textContent = `${item.p}. hodina`;

                    const subjectDiv = document.createElement('div');
                    subjectDiv.className = 'tile-subject';
                    subjectDiv.textContent = item.s;

                    const timeDiv = document.createElement('div');
                    timeDiv.className = 'tile-time';
                    timeDiv.textContent = `${item.start} - ${item.end}`;

                    tile.appendChild(periodDiv);
                    tile.appendChild(subjectDiv);
                    tile.appendChild(timeDiv);
                    scheduleContainer.appendChild(tile);
                });
            }
        }

        updateDashboard();
        setInterval(updateDashboard, 1000);
    </script>
</body>
</html>
