<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dauko Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <!-- Moderný font podobný tvojmu návrhu -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Čas vľavo hore -->
    <div class="top-left">
        <div id="clock">00:00</div>
    </div>
    
    <!-- Logo v strede -->
    <div class="center-content">
        <img src="daukoProfilovka.png" alt="Dauko Logo" class="logo">
    </div>

    <!-- Dátum vpravo hore -->
    <div class="top-right">
        <div id="day">DAY</div>
        <div id="date">00 MON 0000</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
