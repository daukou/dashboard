<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dauko Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-color: #0f111a;
            --panel-bg: #1c2033;
            --text-main: #ffffff;
            --text-muted: #8a92b2;
            --accent-gradient: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
            --danger-gradient: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 12px;
            gap: 12px;
            overflow: hidden;
        }

        .top-row {
            display: flex;
            height: 45%;
            gap: 12px;
        }

        .panel {
            background-color: var(--panel-bg);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            position: relative;
        }

        .panel-time { flex: 1; }
        .panel-date { flex: 1; }
        .panel-notes { 
            flex: 1.2;
            align-items: flex-start;
            padding: 20px;
            justify-content: flex-start;
            overflow: hidden;
        }
        
        .panel-nas {
            flex: 1;
            padding: 20px;
            justify-content: space-between;
            align-items: center;
        }

        #clock {
            font-size: 6rem;
            font-weight: 800;
            letter-spacing: 2px;
        }

        #day {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: 4px;
            white-space: nowrap;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        #date {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .panel-label {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
            width: 100%;
            text-align: left;
            margin-bottom: 10px;
        }

        /* Poznámky */
        .notes-list {
            list-style: none;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
            max-height: 80%;
        }

        .note-item {
            font-size: 0.95rem;
            font-weight: 600;
            background-color: rgba(255, 255, 255, 0.03);
            padding: 10px 12px;
            border-radius: 8px;
            border-left: 4px solid #00d2ff;
            word-break: break-word;
        }

        /* NAS Kruhový Graf */
        .pie-chart-container {
            position: relative;
            width: 110px;
            height: 110px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .pie-chart {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(rgba(255, 255, 255, 0.08) 0% 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.5s ease;
        }

        .pie-chart-inner {
            width: 75%;
            height: 75%;
            background-color: var(--panel-bg);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .nas-percent {
            font-size: 1.2rem;
            font-weight: 800;
        }

        .nas-status-text {
            font-size: 0.65rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .btn-shutdown {
            background: var(--danger-gradient);
            border: none;
            color: white;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 75, 43, 0.3);
            transition: all 0.2s ease;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
        }

        .btn-shutdown:active {
            transform: scale(0.95);
        }

        /* Banner pre Suplovanie */
        #substitution-banner {
            display: none;
            background: rgba(255, 65, 108, 0.15);
            border: 1px solid #ff416c;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 0.95rem;
            color: #fff;
            box-shadow: 0 4px 15px rgba(255, 65, 108, 0.2);
        }

        #substitution-text {
            font-weight: 600;
            margin-left: 8px;
        }

        /* Spodný riadok rozvrhu */
        .bottom-row {
            flex: 1;
            background-color: var(--panel-bg);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        #schedule-label {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 2px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        #schedule {
            display: flex;
            flex: 1;
            gap: 12px;
        }

        .tile {
            flex: 1;
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }

        .tile-period {
            font-size: 0.75rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 4px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .tile-subject {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .tile-time {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .tile.active {
            background: var(--accent-gradient);
            border: none;
            color: #ffffff;
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.4);
            transform: scale(1.02);
        }

        .tile.active .tile-period { color: rgba(255, 255, 255, 0.8); }
        .tile.active .tile-time { color: rgba(255, 255, 255, 0.9); }
    </style>
</head>
<body>

    <div class="top-row">
        <!-- 1. Čas -->
        <div class="panel panel-time">
            <div id="clock">00:00</div>
        </div>

        <!-- 2. Dátum -->
        <div class="panel panel-date">
            <div id="day">DEŇ</div>
            <div id="date">00. MESIAC 0000</div>
        </div>

        <!-- 3. Poznámky -->
        <div class="panel panel-notes">
            <div class="panel-label">Poznámky</div>
            <ul class="notes-list" id="notes-container">
                <li class="note-item" style="opacity: 0.5;">Načítavam...</li>
            </ul>
        </div>

        <!-- 4. Synology NAS -->
        <div class="panel panel-nas">
            <div class="panel-label" style="margin-bottom: 0;">Synology NAS</div>
            
            <div class="pie-chart-container">
                <div class="pie-chart" id="nas-pie">
                    <div class="pie-chart-inner">
                        <div class="nas-percent" id="nas-used-text">...</div>
                        <div class="nas-status-text">použité</div>
                    </div>
                </div>
            </div>

            <button class="btn-shutdown" onclick="shutdownNAS()">Vypnúť NAS</button>
        </div>
    </div>

    <!-- Banner pre EduPage suplovanie -->
    <div id="substitution-banner">
        <strong style="color: #ff416c;">⚠️ ZMENA ROZVRHU:</strong>
        <span id="substitution-text"></span>
    </div>

    <!-- Spodný riadok pre rozvrh -->
    <div class="bottom-row">
        <div id="schedule-label">DNEŠNÝ ROZVRH</div>
        <div id="schedule"></div>
    </div>

    <script>
        // === FIREBASE CONFIG ===
        const firebaseConfig = {
            apiKey: "AIzaSyBZmGJ715pJkMZJut9aSNfsm04oQH1YeCw",
            authDomain: "dauko-dashboard.firebaseapp.com",
            databaseURL: "https://dauko-dashboard-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "dauko-dashboard",
            storageBucket: "dauko-dashboard.firebasestorage.app",
            messagingSenderId: "112349370791",
            appId: "1:112349370791:web:d9ab50d25ecd89bc55be82",
            measurementId: "G-MZRFBJ25SZ"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 1. LOGIKA PRE POZNÁMKY
        db.ref('notes').on('value', (snapshot) => {
            const container = document.getElementById('notes-container');
            container.innerHTML = '';
            const data = snapshot.val();
            
            if (data) {
                Object.keys(data).forEach(key => {
                    const li = document.createElement('li');
                    li.className = 'note-item';
                    li.textContent = data[key].text;
                    container.appendChild(li);
                });
            } else {
                container.innerHTML = '<li class="note-item" style="opacity: 0.4;">Žiadne poznámky</li>';
            }
        });

        // 2. LOGIKA PRE NAS GRAF
        let lastKnownPercent = null;
        let lastUpdateTime = Date.now();

        db.ref('nas/status/usedPercent').on('value', (snapshot) => {
            const percent = snapshot.val();
            if (percent !== null) {
                lastKnownPercent = percent;
                lastUpdateTime = Date.now();
                document.getElementById('nas-used-text').textContent = `${percent}%`;
                document.getElementById('nas-pie').style.background = `conic-gradient(#00d2ff 0% ${percent}%, rgba(255, 255, 255, 0.08) ${percent}% 100%)`;
            }
        });

        setInterval(() => {
            if (Date.now() - lastUpdateTime > 180000) {
                document.getElementById('nas-used-text').textContent = "OFF";
                document.getElementById('nas-pie').style.background = `conic-gradient(#ff4757 0% 100%, rgba(255, 255, 255, 0.08) 100% 100%)`;
            }
        }, 10000);

        // 3. LOGIKA PRE VYPNUTIE NAS
        function shutdownNAS() {
            if (confirm("Naozaj chceš vypnúť Synology NAS? Bude to trvať do 60 sekúnd.")) {
                db.ref('nas/command').set('shutdown').then(() => {
                    alert("Príkaz bol odoslaný. Synology sa čoskoro vypne.");
                }).catch((error) => {
                    alert("Chyba: Nepodarilo sa odoslať príkaz.");
                });
            }
        }

        // 4. LOGIKA PRE EDUPAGE SUPLOVANIE
        function checkSubstitution() {
            fetch('suplovanie.json?t=' + Date.now())
                .then(response => {
                    if (!response.ok) throw new Error('Súbor zatiaľ neexistuje');
                    return response.json();
                })
                .then(data => {
                    if (data && data.has_changes && data.changes.length > 0) {
                        const banner = document.getElementById('substitution-banner');
                        const textContainer = document.getElementById('substitution-text');
                        
                        let text = data.changes.map(c => `${c.period}. hodina: ${c.subject} (${c.room}) - ${c.note}`).join(' | ');
                        textContainer.textContent = text;
                        banner.style.display = 'block';
                    }
                })
                .catch(err => {
                    console.log("Suplovanie:", err.message);
                });
        }

        checkSubstitution();
        setInterval(checkSubstitution, 300000); // Kontrola každých 5 minút

        // === LOGIKA PRE ROZVRH A ČAS ===
        const scheduleData = {
            1: [ 
                { p: 1, s: 'SJL', start: '08:00', end: '08:45' },
                { p: 2, s: 'MAT', start: '08:50', end: '09:35' },
                { p: 3, s: 'INP', start: '09:45', end: '10:30' },
                { p: 4, s: 'ANJ', start: '10:50', end: '11:35' },
                { p: 5, s: 'LIN', start: '11:40', end: '12:25' },
                { p: 6, s: 'PBE', start: '12:35', end: '13:20' },
                { p: 7, s: 'PBE', start: '13:30', end: '14:15' }
            ],
            2: [ 
                { p: 1, s: 'OBP', start: '08:00', end: '08:45' },
                { p: 2, s: 'OBP', start: '08:50', end: '09:35' },
                { p: 3, s: 'ANJ', start: '09:45', end: '10:30' },
                { p: 4, s: 'SJL', start: '10:50', end: '11:35' },
                { p: 5, s: 'MAT', start: '11:40', end: '12:25' },
                { p: 6, s: 'NEJ', start: '12:35', end: '13:20' }
            ],
            3: [ 
                { p: 0, s: 'TSV', start: '07:10', end: '07:55' },
                { p: 1, s: 'TSV', start: '08:00', end: '08:45' },
                { p: 2, s: 'INP', start: '08:50', end: '09:35' },
                { p: 3, s: 'TEM', start: '09:45', end: '10:30' },
                { p: 4, s: 'TEM', start: '10:50', end: '11:35' },
                { p: 5, s: 'OBP', start: '11:40', end: '12:25' },
                { p: 6, s: 'OBP', start: '12:35', end: '13:20' },
                { p: 7, s: 'TH',  start: '13:30', end: '14:15' }
            ],
            4: [ 
                { p: 1, s: 'DDW', start: '08:00', end: '08:45' },
                { p: 2, s: 'DDW', start: '08:50', end: '09:35' },
                { p: 3, s: 'DDW', start: '09:45', end: '10:30' },
                { p: 4, s: 'SJL', start: '10:50', end: '11:35' },
                { p: 5, s: 'OBN', start: '11:40', end: '12:25' },
                { p: 6, s: 'ANJ', start: '12:35', end: '13:20' },
                { p: 7, s: 'ANJ', start: '13:30', end: '14:15' }
            ],
            5: [ 
                { p: 1, s: 'ODP', start: '08:00', end: '08:45' },
                { p: 2, s: 'ODP', start: '08:50', end: '09:35' },
                { p: 3, s: 'NEJ', start: '09:45', end: '10:30' },
                { p: 4, s: 'NEJ', start: '10:50', end: '11:35' },
                { p: 5, s: 'LIN', start: '11:40', end: '12:25' },
                { p: 6, s: 'LIN', start: '12:35', end: '13:20' }
            ]
        };

        function timeToMinutes(timeStr) {
            const [h, m] = timeStr.split(':').map(Number);
            return h * 60 + m;
        }

        let lastRenderedMinute = -1;

        function updateDashboard() {
            const now = new Date();
            const currentHours = now.getHours();
            const currentMinutes = now.getMinutes();
            const currentTotalMinutes = currentHours * 60 + currentMinutes;
            const currentDay = now.getDay();
            
            let hStr = currentHours.toString().padStart(2, '0');
            let mStr = currentMinutes.toString().padStart(2, '0');
            document.getElementById('clock').textContent = `${hStr}:${mStr}`;
            
            if (currentTotalMinutes === lastRenderedMinute) return;
            lastRenderedMinute = currentTotalMinutes;

            const daysArr = ['Nedeľa', 'Pondelok', 'Utorok', 'Streda', 'Štvrtok', 'Piatok', 'Sobota'];
            const monthsArr = ['január', 'február', 'marec', 'apríl', 'máj', 'jún', 'júl', 'august', 'september', 'október', 'november', 'december'];
            
            let dayText = daysArr[currentDay].split('').join(' ');
            document.getElementById('day').textContent = dayText;
            document.getElementById('date').textContent = `${now.getDate()}. ${monthsArr[now.getMonth()]} ${now.getFullYear()}`;

            let displayDay = currentDay;
            let label = "Dnešný rozvrh";
            let todaysSchedule = scheduleData[currentDay];
            let isDayOver = false;

            if (todaysSchedule) {
                const lastClass = todaysSchedule[todaysSchedule.length - 1];
                if (currentTotalMinutes > timeToMinutes(lastClass.end)) {
                    isDayOver = true;
                }
            } else {
                isDayOver = true;
            }

            if (isDayOver) {
                label = "Zajtrajší rozvrh";
                displayDay = currentDay + 1;
                
                if (currentDay === 5 || currentDay === 6 || currentDay === 0) {
                    displayDay = 1;
                    label = "Pondelkový rozvrh";
                }
            }

            const scheduleContainer = document.getElementById('schedule');
            document.getElementById('schedule-label').textContent = label;
            scheduleContainer.innerHTML = ''; 

            const classesToDisplay = scheduleData[displayDay];

            if (classesToDisplay) {
                classesToDisplay.forEach(item => {
                    const tile = document.createElement('div');
                    tile.className = 'tile';

                    if (!isDayOver && displayDay === currentDay) {
                        if (currentTotalMinutes >= timeToMinutes(item.start) && currentTotalMinutes <= timeToMinutes(item.end)) {
                            tile.classList.add('active'); 
                        }
                    }

                    const periodDiv = document.createElement('div');
                    periodDiv.className = 'tile-period';
                    periodDiv.textContent = `${item.p}. hodina`;

                    const subjectDiv = document.createElement('div');
                    subjectDiv.className = 'tile-subject';
                    subjectDiv.textContent = item.s;

                    const timeDiv = document.createElement('div');
                    timeDiv.className = 'tile-time';
                    timeDiv.textContent = `${item.start} - ${item.end}`;

                    tile.appendChild(periodDiv);
                    tile.appendChild(subjectDiv);
                    tile.appendChild(timeDiv);
                    scheduleContainer.appendChild(tile);
                });
            }
        }

        updateDashboard();
        setInterval(updateDashboard, 1000);
    </script>
</body>
</html>
