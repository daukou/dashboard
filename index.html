<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dauko Dashboard</title>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-color: #000000;
            --panel-bg: rgba(28, 28, 30, 0.7);
            --panel-border: rgba(255, 255, 255, 0.1);
            --text-main: #f5f5f7;
            --text-muted: #86868b;
            --accent-color: #0a84ff;
            --danger-color: #ff453a;
            --radius: 24px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 15% 50%, rgba(20, 20, 25, 1), #000000 50%);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            padding: 20px;
            gap: 20px;
            overflow: hidden;
        }

        .main-content {
            flex: 3;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .sidebar {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .top-widgets {
            display: flex;
            gap: 20px;
            flex: 0.8; /* Zabezpečí proporčné rozloženie výšky */
        }

        .panel {
            background: var(--panel-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--panel-border);
            border-radius: var(--radius);
            padding: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .panel-time { flex: 1.2; justify-content: center; align-items: center; }
        .panel-date { flex: 1; justify-content: center; align-items: center; }
        .panel-nas { flex: 1; justify-content: space-between; align-items: center; }
        
        .panel-notes {
            flex: 2; /* Poznámky zaberú zvyšok miesta */
            justify-content: flex-start;
        }

        .panel-schedule {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .panel-label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
            width: 100%;
            text-align: left;
            margin-bottom: 16px;
        }

        /* Typografia zväčšená pre vyplnenie prázdneho miesta */
        #clock {
            font-size: 7.5rem;
            font-weight: 700;
            letter-spacing: -3px;
            line-height: 1;
        }

        #day {
            font-size: 2.8rem;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        #date {
            font-size: 1.4rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        .notes-list {
            list-style: none;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            max-height: 100%;
            padding-right: 10px;
        }

        .notes-list::-webkit-scrollbar, .schedule-list::-webkit-scrollbar {
            display: none;
        }

        .note-item {
            font-size: 1.1rem;
            font-weight: 400;
            background: rgba(255, 255, 255, 0.05);
            padding: 16px;
            border-radius: 16px;
            line-height: 1.4;
            display: flex;
            align-items: center;
        }

        .note-item::before {
            content: '';
            display: block;
            width: 6px;
            height: 6px;
            background-color: var(--accent-color);
            border-radius: 50%;
            margin-right: 12px;
            flex-shrink: 0;
        }

        /* NAS Kruhový Graf zväčšený */
        .pie-chart-container {
            position: relative;
            width: 130px;
            height: 130px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .pie-chart {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(rgba(255, 255, 255, 0.1) 0% 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.5s ease;
        }

        .pie-chart-inner {
            width: 75%;
            height: 75%;
            background-color: #1c1c1e;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .nas-percent {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .btn-shutdown {
            background: rgba(255, 69, 58, 0.15);
            color: var(--danger-color);
            border: none;
            padding: 12px 16px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            margin-top: 15px;
        }

        .btn-shutdown:active {
            background: var(--danger-color);
            color: #fff;
        }

        /* Vertikálny rozvrh - flex: 1 natiahne bloky */
        .schedule-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1; /* Vyplní panel */
        }

        .tile {
            flex: 1; /* Dynamicky natiahne každú hodinu, aby nezostalo prázdne miesto dole */
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 0 20px;
            transition: all 0.3s ease;
            min-height: 60px;
        }

        .tile-left {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 4px;
        }

        .tile-period {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .tile-subject {
            font-size: 1.6rem;
            font-weight: 700;
        }

        .tile-time {
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        .tile.active {
            background: var(--accent-color);
            color: #ffffff;
            box-shadow: 0 8px 24px rgba(10, 132, 255, 0.3);
        }

        .tile.active .tile-period, .tile.active .tile-time {
            color: rgba(255, 255, 255, 0.8);
        }
    </style>
</head>
<body>

    <div class="main-content">
        <div class="top-widgets">
            <div class="panel panel-time">
                <div id="clock">00:00</div>
            </div>

            <div class="panel panel-date">
                <div id="day">DEŇ</div>
                <div id="date">00. MESIAC 0000</div>
            </div>

            <div class="panel panel-nas">
                <div class="panel-label">Synology NAS</div>
                <div class="pie-chart-container">
                    <div class="pie-chart" id="nas-pie">
                        <div class="pie-chart-inner">
                            <div class="nas-percent" id="nas-used-text">--%</div>
                        </div>
                    </div>
                </div>
                <button class="btn-shutdown" onclick="shutdownNAS()">Vypnúť</button>
            </div>
        </div>

        <div class="panel panel-notes">
            <div class="panel-label">Poznámky</div>
            <ul class="notes-list" id="notes-container">
                <li class="note-item" style="color: var(--text-muted);">Načítavam...</li>
            </ul>
        </div>
    </div>

    <div class="sidebar">
        <div class="panel panel-schedule">
            <div class="panel-label" id="schedule-label">DNEŠNÝ ROZVRH</div>
            <div class="schedule-list" id="schedule"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBZmGJ715pJkMZJut9aSNfsm04oQH1YeCw",
            authDomain: "dauko-dashboard.firebaseapp.com",
            databaseURL: "https://dauko-dashboard-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "dauko-dashboard",
            storageBucket: "dauko-dashboard.firebasestorage.app",
            messagingSenderId: "112349370791",
            appId: "1:112349370791:web:d9ab50d25ecd89bc55be82"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        db.ref('notes').on('value', (snapshot) => {
            const container = document.getElementById('notes-container');
            container.innerHTML = '';
            const data = snapshot.val();
            
            if (data) {
                Object.keys(data).forEach(key => {
                    const li = document.createElement('li');
                    li.className = 'note-item';
                    li.textContent = data[key].text;
                    container.appendChild(li);
                });
            } else {
                container.innerHTML = '<li class="note-item" style="color: var(--text-muted);">Žiadne poznámky</li>';
            }
        });

        db.ref('nas/status/usedPercent').on('value', (snapshot) => {
            const percent = snapshot.val();
            if (percent !== null) {
                document.getElementById('nas-used-text').textContent = `${percent}%`;
                document.getElementById('nas-pie').style.background = `conic-gradient(var(--accent-color) 0% ${percent}%, rgba(255, 255, 255, 0.08) ${percent}% 100%)`;
            }
        });

        function shutdownNAS() {
            if (confirm("Naozaj chceš vypnúť Synology NAS?")) {
                db.ref('nas/command').set('shutdown').then(() => {
                    alert("Príkaz bol odoslaný.");
                }).catch(() => {
                    alert("Chyba: Nepodarilo sa odoslať príkaz.");
                });
            }
        }

        const scheduleData = {
            1: [ 
                { p: 1, s: 'SJL', start: '08:00', end: '08:45' },
                { p: 2, s: 'MAT', start: '08:50', end: '09:35' },
                { p: 3, s: 'INP', start: '09:45', end: '10:30' },
                { p: 4, s: 'ANJ', start: '10:50', end: '11:35' },
                { p: 5, s: 'LIN', start: '11:40', end: '12:25' },
                { p: 6, s: 'PBE', start: '12:35', end: '13:20' },
                { p: 7, s: 'PBE', start: '13:30', end: '14:15' }
            ],
            2: [ 
                { p: 1, s: 'OBP', start: '08:00', end: '08:45' },
                { p: 2, s: 'OBP', start: '08:50', end: '09:35' },
                { p: 3, s: 'ANJ', start: '09:45', end: '10:30' },
                { p: 4, s: 'SJL', start: '10:50', end: '11:35' },
                { p: 5, s: 'MAT', start: '11:40', end: '12:25' },
                { p: 6, s: 'NEJ', start: '12:35', end: '13:20' }
            ],
            3: [ 
                { p: 0, s: 'TSV', start: '07:10', end: '07:55' },
                { p: 1, s: 'TSV', start: '08:00', end: '08:45' },
                { p: 2, s: 'INP', start: '08:50', end: '09:35' },
                { p: 3, s: 'TEM', start: '09:45', end: '10:30' },
                { p: 4, s: 'TEM', start: '10:50', end: '11:35' },
                { p: 5, s: 'OBP', start: '11:40', end: '12:25' },
                { p: 6, s: 'OBP', start: '12:35', end: '13:20' },
                { p: 7, s: 'TH',  start: '13:30', end: '14:15' }
            ],
            4: [ 
                { p: 1, s: 'DDW', start: '08:00', end: '08:45' },
                { p: 2, s: 'DDW', start: '08:50', end: '09:35' },
                { p: 3, s: 'DDW', start: '09:45', end: '10:30' },
                { p: 4, s: 'SJL', start: '10:50', end: '11:35' },
                { p: 5, s: 'OBN', start: '11:40', end: '12:25' },
                { p: 6, s: 'ANJ', start: '12:35', end: '13:20' },
                { p: 7, s: 'ANJ', start: '13:30', end: '14:15' }
            ],
            5: [ 
                { p: 1, s: 'ODP', start: '08:00', end: '08:45' },
                { p: 2, s: 'ODP', start: '08:50', end: '09:35' },
                { p: 3, s: 'NEJ', start: '09:45', end: '10:30' },
                { p: 4, s: 'NEJ', start: '10:50', end: '11:35' },
                { p: 5, s: 'LIN', start: '11:40', end: '12:25' },
                { p: 6, s: 'LIN', start: '12:35', end: '13:20' }
            ]
        };

        function timeToMinutes(timeStr) {
            const [h, m] = timeStr.split(':').map(Number);
            return h * 60 + m;
        }

        function updateDashboard() {
            const now = new Date();
            const currentHours = now.getHours();
            const currentMinutes = now.getMinutes();
            const currentTotalMinutes = currentHours * 60 + currentMinutes;
            const currentDay = now.getDay();
            
            let hStr = currentHours.toString().padStart(2, '0');
            let mStr = currentMinutes.toString().padStart(2, '0');
            document.getElementById('clock').textContent = `${hStr}:${mStr}`;

            const daysArr = ['Nedeľa', 'Pondelok', 'Utorok', 'Streda', 'Štvrtok', 'Piatok', 'Sobota'];
            const monthsArr = ['január', 'február', 'marec', 'apríl', 'máj', 'jún', 'júl', 'august', 'september', 'október', 'november', 'december'];
            
            document.getElementById('day').textContent = daysArr[currentDay];
            document.getElementById('date').textContent = `${now.getDate()}. ${monthsArr[now.getMonth()]} ${now.getFullYear()}`;

            let displayDay = currentDay;
            let label = "Dnešný rozvrh";
            let todaysSchedule = scheduleData[currentDay];
            let isDayOver = false;

            if (todaysSchedule) {
                const lastClass = todaysSchedule[todaysSchedule.length - 1];
                if (currentTotalMinutes > timeToMinutes(lastClass.end)) {
                    isDayOver = true;
                }
            } else {
                isDayOver = true;
            }

            if (isDayOver) {
                label = "Zajtrajší rozvrh";
                displayDay = currentDay + 1;
                
                if (currentDay === 5 || currentDay === 6 || currentDay === 0) {
                    displayDay = 1;
                    label = "Pondelkový rozvrh";
                }
            }

            document.getElementById('schedule-label').textContent = label;
            const scheduleContainer = document.getElementById('schedule');
            scheduleContainer.innerHTML = ''; 

            const classesToDisplay = scheduleData[displayDay];

            if (classesToDisplay) {
                classesToDisplay.forEach(item => {
                    const tile = document.createElement('div');
                    tile.className = 'tile';

                    if (!isDayOver && displayDay === currentDay) {
                        if (currentTotalMinutes >= timeToMinutes(item.start) && currentTotalMinutes <= timeToMinutes(item.end)) {
                            tile.classList.add('active'); 
                        }
                    }

                    const leftDiv = document.createElement('div');
                    leftDiv.className = 'tile-left';

                    const periodDiv = document.createElement('div');
                    periodDiv.className = 'tile-period';
                    periodDiv.textContent = `${item.p}. hodina`;

                    const subjectDiv = document.createElement('div');
                    subjectDiv.className = 'tile-subject';
                    subjectDiv.textContent = item.s;

                    leftDiv.appendChild(periodDiv);
                    leftDiv.appendChild(subjectDiv);

                    const rightDiv = document.createElement('div');
                    rightDiv.className = 'tile-time';
                    rightDiv.textContent = `${item.start} - ${item.end}`;

                    tile.appendChild(leftDiv);
                    tile.appendChild(rightDiv);

                    scheduleContainer.appendChild(tile);
                });
            }
        }

        updateDashboard();
        setInterval(updateDashboard, 1000);
    </script>
</body>
</html>
