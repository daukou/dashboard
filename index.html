<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dauko Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Tvoje logo ako pozadie na celú obrazovku */
            background-image: url('daukoProfilovka.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #000000;
            
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Ľavý horný roh - Čas */
        .top-left {
            position: absolute;
            top: 50px;
            left: 60px;
            font-size: 6rem;
            font-weight: 700;
        }

        /* Pravý horný roh - Dátum a Rozvrh */
        .top-right {
            position: absolute;
            top: 50px;
            right: 60px;
            display: flex;
            flex-direction: column;
            align-items: flex-end; /* Zarovnanie celého bloku doprava */
        }

        #day {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: 12px;
            margin-right: -12px;
            margin-bottom: 5px;
        }

        #date {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 20px; /* Medzera medzi dátumom a rozvrhom */
        }

        /* Kontajner pre rozvrh */
        #schedule {
            display: flex;
            gap: 8px; /* Medzery medzi predmetmi */
            flex-wrap: wrap;
            justify-content: flex-end;
            max-width: 400px;
        }

        /* Dizajn jednotlivého predmetu */
        .subject {
            border: 2px solid #ffffff;
            border-radius: 6px;
            padding: 5px 12px;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 1px;
            background-color: rgba(0, 0, 0, 0.5); /* Jemne tmavé pozadie pre lepšiu čitateľnosť */
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body>

    <div class="top-left">
        <div id="clock">00:00</div>
    </div>

    <div class="top-right">
        <div id="day">DEŇ</div>
        <div id="date">00 MES 0000</div>
        <!-- Tu sa automaticky vygeneruje rozvrh -->
        <div id="schedule"></div>
    </div>

    <script>
        // Tvoj reálny rozvrh vyextrahovaný z obrázka
        const weeklySchedule = {
            1: ['SJL', 'MAT', 'INP', 'ANJ', 'LIN', 'PBE'], // Pondelok
            2: ['OBP', 'ANJ', 'SJL', 'MAT', 'NEJ'],        // Utorok
            3: ['TSV', 'INP', 'TEM', 'OBP', 'TH'],         // Streda
            4: ['DDW', 'SJL', 'OBN', 'ANJ'],               // Štvrtok
            5: ['ODP', 'NEJ', 'LIN'],                      // Piatok
            6: ['VOĽNO'],                                  // Sobota
            0: ['VOĽNO']                                   // Nedeľa
        };

        // Uchovanie aktuálneho dňa, aby sme rozvrh neprekresľovali zbytočne každú sekundu
        let currentDayIndex = -1;

        function updateDashboard() {
            const now = new Date();
            
            // 1. Aktualizácia ČASU
            let hours = now.getHours().toString().padStart(2, '0');
            let minutes = now.getMinutes().toString().padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${minutes}`;
            
            // 2. Aktualizácia DÁTUMU (iba ak sa zmenil deň)
            if (now.getDay() !== currentDayIndex) {
                currentDayIndex = now.getDay();
                
                const days = ['N E D E Ľ A', 'P O N D E L O K', 'U T O R O K', 'S T R E D A', 'Š T V R T O K', 'P I A T O K', 'S O B O T A'];
                const months = ['JANUÁR', 'FEBRUÁR', 'MAREC', 'APRÍL', 'MÁJ', 'JÚN', 'JÚL', 'AUGUST', 'SEPTEMBER', 'OKTÓBER', 'NOVEMBER', 'DECEMBER'];
                
                // Vykreslenie dňa a dátumu
                document.getElementById('day').textContent = days[currentDayIndex];
                document.getElementById('date').textContent = `${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`;

                // 3. Vykreslenie ROZVRHU
                const scheduleContainer = document.getElementById('schedule');
                scheduleContainer.innerHTML = ''; // Vymaže starý rozvrh

                const todaysSubjects = weeklySchedule[currentDayIndex];
                
                todaysSubjects.forEach(subject => {
                    const span = document.createElement('span');
                    span.className = 'subject';
                    span.textContent = subject;
                    scheduleContainer.appendChild(span);
                });
            }
        }

        // Spustenie
        updateDashboard();
        setInterval(updateDashboard, 1000);
    </script>
</body>
</html>
