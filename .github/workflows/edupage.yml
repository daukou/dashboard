name: EduPage Sync

on:
  schedule:
    - cron: '0 * * * *' # Spustí sa každú hodinu
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-substitution:
    runs-on: windows-latest # <--- TOTO SME ZMENILI
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install edupage-api requests

      - name: Run EduPage script
        run: python fetch_edupage.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add suplovanie.json
          git commit -m "Auto-update suplovanie.json" || exit 0
          git push
